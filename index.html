<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="river.io llc — native, on-device software, and the catalogue raisonné of Jeffrey B. Kunzelman's work published online since 1993." />
  <link rel="canonical" href="https://www.river.io/" />
  <title>river.io</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero img {
      display: block;
      width: min(540px, 80vw);
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem 1.8rem;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
    nav a {
      color: #6f6f6f;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    nav a:hover,
    nav a:focus-visible {
      color: #fff;
      border-bottom-color: #444;
      outline: none;
    }
    .hero p {
      position: absolute;
      margin: 0;
      color: #fff;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(1rem, 2.4vw, 1.6rem);
      letter-spacing: 0.32em;
      text-transform: lowercase;
      text-shadow:
        0 0 24px rgba(0, 0, 0, 0.85),
        0 0 10px rgba(0, 0, 0, 0.75),
        0 1px 2px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="image.png" alt="Io" />
    <p>river.io</p>
  </div>
  <nav aria-label="Site sections">
    <a href="/software/">software</a>
    <a href="/spacetrucker/">catalogue</a>
    <a href="/blog/">the dark factory</a>
    <a href="/jeff/">jeff</a>
  </nav>
</body>
</html>
